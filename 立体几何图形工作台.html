<script>window.SOLIDS_INITIAL="cube";</script><script type="module">// Analytic solid models; no renderer or browser dependency. Length units are arbitrary but consistent.
const sqrt=Math.sqrt, PI=Math.PI;
const param=(label,symbol,value,min=.25,max=6)=>({label,symbol,default:value,min,max,step:.05});
const catalog=[
 {id:'cube',name:'正方体',group:'棱柱',params:{a:param('棱长','a',2)},note:'六个面都是正方形；相邻棱互相垂直。'},
 {id:'cuboid',name:'长方体',group:'棱柱',params:{a:param('长','a',3),b:param('宽','b',2),c:param('高','c',2.5)},note:'三个相邻棱长可以独立改变。'},
 {id:'triangular-prism',name:'直三棱柱（正三角形底）',group:'棱柱',params:{a:param('底边长','a',2.4),h:param('高','h',3)},note:'本资产的底面限定为正三角形，侧棱垂直于底面。'},
 {id:'hexagonal-prism',name:'正六棱柱',group:'棱柱',params:{a:param('底边长','a',1.5),h:param('高','h',2.5)},note:'底面为正六边形，侧棱垂直于底面。'},
 {id:'oblique-prism',name:'斜四棱柱（矩形底）',group:'棱柱',params:{a:param('底面长','a',3),b:param('底面宽','b',2),h:param('垂直高','h',2.5),dx:param('上底横向平移','dx',1,-3,3),dy:param('上底纵向平移','dy',.4,-3,3)},note:'侧棱长通常不等于高；平移为零时成为直棱柱。'},
 {id:'tetrahedron',name:'正四面体',group:'棱锥与棱台',params:{a:param('棱长','a',3)},note:'四个面都是正三角形，六条棱等长；高度由棱长确定。'},
 {id:'square-pyramid',name:'正四棱锥',group:'棱锥与棱台',params:{a:param('底边长','a',3),h:param('高','h',3)},note:'底面为正方形，顶点在底面中心的垂线上；斜高与侧棱不同。'},
 {id:'square-frustum',name:'正四棱台',group:'棱锥与棱台',params:{a:param('下底边长','a',3.5),b:param('上底边长','b',1.8,0,6),h:param('高','h',2.5)},note:'上下底对应边平行且同心；上底边为零时是棱锥极限，相等时是棱柱极限。'},
 {id:'cylinder',name:'圆柱',group:'旋转体',params:{R:param('半径','R',1.5),h:param('高','h',3)},note:'本资产为直圆柱；底面积与高共同确定体积。'},
 {id:'cone',name:'圆锥',group:'旋转体',params:{R:param('底面半径','R',1.8),h:param('高','h',3)},note:'本资产为直圆锥；母线长由半径和高确定。'},
 {id:'cone-frustum',name:'圆台',group:'旋转体',params:{R:param('下底半径','R',2),r:param('上底半径','r',1,0,6),h:param('高','h',2.5)},note:'上下底同轴；上底半径为零时是圆锥极限，相等时是圆柱极限。'},
 {id:'sphere',name:'球',group:'旋转体',params:{R:param('半径','R',2)},note:'体积和表面积按解析公式计算；绘制时用曲面分段近似。'},
 {id:'hemisphere',name:'半球',group:'旋转体',params:{R:param('半径','R',2)},note:'总表面积包含底面圆盘，曲面面积另列。'},
 {id:'octahedron',name:'正八面体',group:'正多面体',params:{a:param('棱长','a',2.5)},note:'八个面都是正三角形；六个顶点，十二条棱。'},
];
const defaults=id=>Object.fromEntries(getSpec(id).params?Object.entries(getSpec(id).params).map(([k,p])=>[k,p.default]):[]);
function getSpec(id){const s=catalog.find(s=>s.id===id);if(!s)throw new RangeError('未知几何体：'+id);return s;}
const sub=(a,b)=>a.map((v,i)=>v-b[i]);
const dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0);
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const length=v=>Math.hypot(...v);
const mean=vs=>vs[0].map((_,i)=>vs.reduce((s,p)=>s+p[i],0)/vs.length);
function oriented(vertices,faces){const center=mean(vertices);return faces.map(f=>{const n=cross(sub(vertices[f[1]],vertices[f[0]]),sub(vertices[f[2]],vertices[f[0]]));return dot(n,sub(mean(f.map(i=>vertices[i])),center))<0?[...f].reverse():f;});}
function prism(base,h,shift=[0,0],ratio=1){const n=base.length,vertices=[...base.map(([x,y])=>[x,y,0])],faces=[];
 if(ratio===0){vertices.push([shift[0],shift[1],h]);faces.push([...Array(n).keys()]);for(let i=0;i<n;i++)faces.push([i,(i+1)%n,n]);}
 else{vertices.push(...base.map(([x,y])=>[x*ratio+shift[0],y*ratio+shift[1],h]));faces.push([...Array(n).keys()],[...Array(n).keys()].map(i=>i+n));for(let i=0;i<n;i++)faces.push([i,(i+1)%n,(i+1)%n+n,i+n]);}
 return {vertices,faces};}
const rectangle=(a,b)=>[[-a/2,-b/2],[a/2,-b/2],[a/2,b/2],[-a/2,b/2]];
const regular=(n,a)=>Array.from({length:n},(_,i)=>{const t=2*PI*i/n+PI/2,r=a/(2*Math.sin(PI/n));return [r*Math.cos(t),r*Math.sin(t)];});
function revolution(layers,segments){const vertices=[],rings=[],faces=[];
 for(const [r,z] of layers){if(r===0){rings.push([vertices.length]);vertices.push([0,0,z]);}else{rings.push(Array.from({length:segments},(_,i)=>{const t=2*PI*i/segments;vertices.push([r*Math.cos(t),r*Math.sin(t),z]);return vertices.length-1;}));}}
 for(let k=0;k<rings.length-1;k++){const a=rings[k],b=rings[k+1];for(let i=0;i<segments;i++){const j=(i+1)%segments;if(a.length===1)faces.push([a[0],b[i],b[j]]);else if(b.length===1)faces.push([a[i],a[j],b[0]]);else faces.push([a[i],a[j],b[j],b[i]]);}}
 for(const ring of [rings[0],rings.at(-1)])if(ring.length>1)faces.push([...ring]);
 return {vertices,faces,rings};}
function createSolid(id,input={},options={}){
 const spec=getSpec(id),p=defaults(id);
 for(const [k,v] of Object.entries(input)){if(!Object.hasOwn(p,k))throw new RangeError('未知参数：'+k);if(typeof v!=='number'||!Number.isFinite(v))throw new TypeError('参数必须为有限数：'+k);p[k]=v;}
 for(const [k,v] of Object.entries(p))if((k==='dx'||k==='dy')?false:(k==='r'||(id==='square-frustum'&&k==='b'))?v<0:v<=0)throw new RangeError('长度参数越界：'+k);
 if(id==='cone-frustum'&&p.r>p.R)throw new RangeError('上底半径 r 不得大于下底半径 R');
 if(id==='square-frustum'&&p.b>p.a)throw new RangeError('上底边长 b 不得大于下底边长 a');
 const seg=options.segments??64;if(!Number.isInteger(seg)||seg<12||seg>256)throw new RangeError('segments 必须为 12–256 的整数');
 let mesh,volume,area,lateralArea=null,curved=false,featureRings=[],classification=spec.name;
 const {a,b,c,h,R,r,dx,dy}=p;
 switch(id){
 case 'cube':mesh=prism(rectangle(a,a),a);volume=a**3;area=6*a*a;break;
 case 'cuboid':mesh=prism(rectangle(a,b),c);volume=a*b*c;area=2*(a*b+b*c+c*a);break;
 case 'triangular-prism':mesh=prism(regular(3,a),h);volume=sqrt(3)/4*a*a*h;lateralArea=3*a*h;area=lateralArea+sqrt(3)/2*a*a;break;
 case 'hexagonal-prism':mesh=prism(regular(6,a),h);volume=3*sqrt(3)/2*a*a*h;lateralArea=6*a*h;area=lateralArea+3*sqrt(3)*a*a;break;
 case 'oblique-prism':mesh=prism(rectangle(a,b),h,[dx,dy]);volume=a*b*h;lateralArea=2*a*Math.hypot(h,dy)+2*b*Math.hypot(h,dx);area=lateralArea+2*a*b;classification=(dx===0&&dy===0)?'直四棱柱（矩形底）':'斜四棱柱（矩形底）';break;

let construction = 'none';
let sectionHeight = 0.5;
const constructionModels = {projection:'cube',midpoints:'cube',section:'cube','tetra-line':'tetrahedron','tetra-dihedral':'tetrahedron','pyramid-line':'square-pyramid','pyramid-dihedral':'square-pyramid'};
renderSolidSVG = function(model, view, lesson, options = {}) {
  const original = baseRenderSolidSVG(model, view, lesson, options);
  if (model.id !== constructionModels[construction] || (options.width && options.width !== 700)) return original;
  const width = options.width ?? 700, height = options.height ?? 520;
  const {yaw, pitch, zoom} = {...defaultView, ...view};
  const vertices = model.vertices;
  const low = [0,1,2].map(index => Math.min(...vertices.map(vertex => vertex[index])));
  const high = [0,1,2].map(index => Math.max(...vertices.map(vertex => vertex[index])));
  const center = low.map((value,index) => (value + high[index]) / 2);
  const radius = Math.max(...vertices.map(vertex => length(sub(vertex,center))));
  const scale = Math.min(width,height)*.37*zoom/radius;
  const right = [Math.cos(yaw), Math.sin(yaw), 0];
  const up = [-Math.sin(yaw)*Math.sin(pitch), Math.cos(yaw)*Math.sin(pitch), Math.cos(pitch)];
  const point = vertex => { const delta = sub(vertex,center); return [width/2+dot(delta,right)*scale,height/2-dot(delta,up)*scale]; };
  const pair = vertex => point(vertex).map(value => value.toFixed(2)).join(',');
  const midpoint = (first,second) => first.map((value,index) => (value+second[index])/2);
  const line = (first,second,dashed = false) => `<path d="M${pair(first)} L${pair(second)}" fill="none" stroke="#c2502f" stroke-width="3" ${dashed?'stroke-dasharray="7 5"':''}/>`;
  const label = (vertex,text) => { const [x,y]=point(vertex); return `<circle cx="${x}" cy="${y}" r="4" fill="#c2502f"/><text x="${x+8}" y="${y-8}" fill="#a83d20" font-size="18" font-family="Georgia,serif" paint-order="stroke" stroke="white" stroke-width="4">${text}</text>`; };
  const arc = (first,vertex,last) => {
    const firstVector=sub(first,vertex),lastVector=sub(last,vertex);
    const unitFirst=firstVector.map(value=>value/length(firstVector)),unitLast=lastVector.map(value=>value/length(lastVector));
    const angle=Math.acos(Math.max(-1,Math.min(1,dot(unitFirst,unitLast))));
    const distance=Math.min(length(firstVector),length(lastVector))*.22;
    const points=Array.from({length:17},(_,index)=>{const t=angle*index/16;return vertex.map((value,axis)=>value+distance*(unitFirst[axis]*Math.sin(angle-t)+unitLast[axis]*Math.sin(t))/Math.sin(angle));});
    return `<path d="M${points.map(pair).join(' L')}" fill="none" stroke="#c2502f" stroke-width="2.4"/>`;
  };
  let overlay = '';
  if (construction === 'projection') {
    overlay = line(vertices[0],vertices[6])+line(vertices[0],vertices[2],true)+line(vertices[2],vertices[6],true);
  } else if (construction === 'midpoints') {
    const first=midpoint(vertices[0],vertices[1]),second=midpoint(vertices[0],vertices[3]);
    overlay = line(first,second)+line(vertices[1],vertices[3],true)+label(first,'M')+label(second,'N');
  } else if (construction === 'section') {
    const section=vertices.slice(0,4).map((vertex,index)=>vertex.map((value,axis)=>value+(vertices[index+4][axis]-value)*sectionHeight));
    overlay = `<polygon points="${section.map(pair).join(' ')}" fill="#e9a35c" fill-opacity=".38" stroke="#bf572d" stroke-width="3"/>`;
  } else {
    const isTetra=model.id==='tetrahedron';
    const apex=vertices[isTetra?3:4],base=vertices[0],center=mean(vertices.slice(0,isTetra?3:4));
    const middle=midpoint(vertices[0],vertices[1]);
    if (construction.endsWith('line')) {
      overlay=line(apex,base)+line(apex,center,true)+line(base,center,true)+arc(apex,base,center)+label(center,'O');
    } else {
      overlay=line(apex,middle)+line(center,middle,true)+line(apex,center,true)+arc(apex,middle,center)+label(center,'O')+label(middle,'M');
    }
  }
  return original.replace('</svg>', `<g aria-label="题型辅助构造">${overlay}</g></svg>`);
};
function installConstructions(lockedSolid){
  const controls=document.createElement('section');
  controls.className='construction-controls';
  controls.innerHTML=`<h3>题型辅助构造</h3><label for="construction">选择构造</label><select id="construction"><option value="none">基础几何体</option><optgroup label="正方体"><option value="projection">体对角线与底面射影</option><option value="midpoints">三角形中位线</option><option value="section">平行底面的截面</option></optgroup><optgroup label="正四面体"><option value="tetra-line">侧棱与底面所成的角</option><option value="tetra-dihedral">侧面与底面的二面角</option></optgroup><optgroup label="正四棱锥"><option value="pyramid-line">侧棱与底面所成的角</option><option value="pyramid-dihedral">侧面与底面的二面角</option></optgroup></select><label id="height-label" hidden>截面高度 <input id="section-height" type="range" min="0" max="1" step="0.01" value="0.5"><output id="section-value">50%</output></label><p id="construction-note">可切换其他几何体，调整视角并导出当前 SVG。</p>`;
  document.querySelector('.controls').prepend(controls);
  controls.after(document.querySelector('#asset-picker'));
  const select=controls.querySelector('select'),slider=controls.querySelector('input');
  const notes={none:'可切换其他几何体，调整视角并导出当前 SVG。',projection:'红实线为 AC′，虚线为射影 AC 与垂线 CC′；用于观察线面角。',midpoints:'M、N 分别为 AB、AD 的中点，MN ∥ BD；用于观察中位线。',section:'截面与底面平行；滑块的 0% 与 100% 分别对应下底面和上底面。','tetra-line':'O 为正三角形 ABC 的中心，SO 垂直底面；∠SAO 是侧棱 SA 与底面所成的角。','pyramid-line':'O 为正方形 ABCD 的中心，SO 垂直底面；∠SAO 是侧棱 SA 与底面所成的角。','tetra-dihedral':'M 为 AB 中点，O 为底面中心；SM、OM 均垂直 AB，∠SMO 是侧面 SAB 与底面的二面角的平面角。','pyramid-dihedral':'M 为 AB 中点，O 为底面中心；SM、OM 均垂直 AB，∠SMO 是侧面 SAB 与底面的二面角的平面角。'};
  if(lockedSolid){
    for(const option of select.querySelectorAll('optgroup option')){
      if(constructionModels[option.value]!==lockedSolid)option.remove();
    }
    for(const group of select.querySelectorAll('optgroup:empty'))group.remove();
    notes.none='本页固定此几何体，可调整视角并导出当前 SVG。';
    controls.querySelector('#construction-note').textContent=notes.none;
  }
  function refresh(){document.querySelector('#yaw').dispatchEvent(new Event('input'));}
  select.addEventListener('change',()=>{
    construction=select.value||'none';
    if(!lockedSolid && construction !== 'none' && window.solidsGallery.getState().math.solidId !== constructionModels[construction]) location.hash='scene='+constructionModels[construction];
    controls.querySelector('#height-label').hidden=construction!=='section';
    controls.querySelector('#construction-note').textContent=notes[construction];
    const labels=document.querySelector('#labels');
    if(construction!=='none' && !labels.checked) labels.click();
    refresh();
  });
  slider.addEventListener('input',()=>{sectionHeight=Number(slider.value);controls.querySelector('output').textContent=Math.round(sectionHeight*100)+'%';refresh();});
  window.addEventListener('hashchange',()=>{if(construction!=='none' && window.solidsGallery.getState().math.solidId!==constructionModels[construction]){construction='none';select.value='none';controls.querySelector('#height-label').hidden=true;controls.querySelector('#construction-note').textContent=notes.none;}else if(construction!=='none'){const labels=document.querySelector('#labels');if(!labels.checked)labels.click();refresh();}});
}

if(typeof document!=='undefined'){
 const lock=new URLSearchParams(location.search).get('lock');
 const lockedSolid=lock===null?null:(catalog.find(item=>item.id===lock)?.id??window.SOLIDS_INITIAL??'cube');
 startGallery(lockedSolid);installConstructions(lockedSolid);
}
</script></body></html>
